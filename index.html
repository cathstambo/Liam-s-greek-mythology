<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#083f4b">
  <meta name="description" content="Meet Poseidon in Liam's illustrated Greek mythology book.">
  <title>Liam's Greek Mythology Corner</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <section id="rotate-message" role="status" aria-labelledby="rotate-title">
    <div><p aria-hidden="true" class="rotate-icon">↻</p>
    <h2 id="rotate-title">Turn your device sideways</h2>
    <p>Liam’s mythology book is best explored in landscape.</p></div>
  </section>
  <header class="site-header">
    <h1>Liam's Greek Mythology Corner</h1>
    <button id="home" type="button" aria-label="Home — return to Poseidon's first page">Home</button>
  </header>
  <main>
    <div id="book" class="book" aria-label="Poseidon's illustrated two-page book"></div>
    <nav class="page-navigation" aria-label="Book pages">
      <span id="page-status">Pages 1 &amp; 2 of 2</span>
      <button id="open-tools" type="button">Layout checks<span id="fit-indicator" aria-hidden="true"></span></button>
    </nav>

    <p id="fit-announcement" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><p>This illustrated prototype needs JavaScript for its editable text and navigation.</p></noscript>
  </main>
  <dialog id="tools" aria-labelledby="tools-title">
    <h2 id="tools-title">Typography &amp; layout checks</h2>
    <p>Test controls for reviewing this prototype. Text never shrinks automatically to fit a panel.</p>
    <label for="text-scale">Text scale <output id="scale-value">100%</output></label>
    <input id="text-scale" type="range" min="100" max="140" step="10" value="100">
    <label><input id="diagnostics" type="checkbox"> Show text-panel bounds</label>
    <p id="fit-status"></p>
    <ul id="overflow-list"></ul>
    <button id="print" type="button">Print A5 pages</button>
    <form method="dialog"><button>Close checks</button></form>
  </dialog>
</body>
</html>
