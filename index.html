<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#083f4b">
  <meta name="description" content="Meet Poseidon and Zeus in Liam's illustrated Greek mythology book.">
  <title>Liam's Greek Mythology Corner</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Liam's Greek Mythology Corner</h1>
    <label class="character-picker">God <select id="character"><option value="poseidon">Poseidon</option><option value="zeus">Zeus</option></select></label>
    <button id="home" type="button" aria-label="Home — return to contents">Home</button>
  </header>
  <main>
    <section id="contents" class="contents" aria-labelledby="contents-title">
      <h2 id="contents-title">Contents</h2>
      <nav aria-label="Chapters">
        <ul>
          <li><a href="?god=poseidon">Poseidon — God of the Sea</a></li>
          <li><a href="?god=zeus">Zeus — King of the Gods</a></li>
        </ul>
      </nav>
    </section>
    <div id="reader" hidden>
    <div id="book" class="book" aria-label="Poseidon's illustrated two-page book"></div>
    <nav class="page-navigation" aria-label="Book pages">
      <button id="previous" type="button">← Previous page</button>
      <span id="page-status">Pages 1 &amp; 2 of 2</span>
      <button id="next" type="button">Next page →</button>
      <button id="view-mode" type="button" aria-pressed="false" aria-controls="book">Two pages</button>
      <button id="open-tools" type="button">Layout checks<span id="fit-indicator" aria-hidden="true"></span></button>
    </nav>

    <p id="fit-announcement" class="sr-only" role="status" aria-live="polite"></p>
    </div>
    <noscript><p>This illustrated prototype needs JavaScript for its editable text and navigation.</p></noscript>
  </main>
  <dialog id="tools" aria-labelledby="tools-title">
    <h2 id="tools-title">Typography &amp; layout checks</h2>
    <p>Artwork and text scale together. These test controls enlarge the text independently to assess its limits.</p>
    <p id="font-status" role="status"></p>
    <label for="text-scale">Text scale <output id="scale-value">100%</output></label>
    <input id="text-scale" type="range" min="100" max="140" step="10" value="100">
    <label><input id="diagnostics" type="checkbox"> Show text-panel bounds</label>
    <p id="fit-status"></p>
    <ul id="overflow-list"></ul>
    <button id="print" type="button">Print A5 pages</button>
    <form method="dialog"><button>Close checks</button></form>
  </dialog>
</body>
</html>
